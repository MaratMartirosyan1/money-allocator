<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` lets the page paint under the iPhone's notch and
      home indicator; the layout keeps controls clear of them with
      env(safe-area-inset-*). Zoom is deliberately not capped — blocking it
      would break the one accessibility affordance every phone has.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />
    <title>Money Allocator</title>
  </head>
  <body>
    <script>
      // Applies the saved theme before first paint, so dark-theme users never
      // see a flash of light. Kept in sync afterwards by useAppliedTheme.
      try {
        var saved = JSON.parse(localStorage.getItem('mny-allocator') || '{}')
        var theme = saved && saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {
        /* first visit, or storage blocked — fall back to the OS preference */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
